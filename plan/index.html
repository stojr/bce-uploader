function plain(raw){

function put(html){
  // A remembered key decrypts in a few ms - before this shell has finished
  // loading. Writing then APPENDS to the shell instead of replacing it (the
  // sign-in styles bleed into the page), so wait for the load to end.
  if(document.readyState!=="complete"){window.addEventListener("load",function(){put(html)});return}
  var h=location.hash;
  document.open();document.write(html);document.close();
  if(h&&h.length>1&&h.indexOf("#v=")!==0)setTimeout(function(){try{var e=document.getElementById(decodeURIComponent(h.slice(1)));if(e)e.scrollIntoView()}catch(x){}},60);
}
