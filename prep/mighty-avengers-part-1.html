function plain(raw){
  return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])
    .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},k,b(CT))})
    .then(function(buf){return new TextDecoder().decode(buf)});
}

  if(document.readyState!=="complete"){window.addEventListener("load",function(){put(html)});return}
  var h=location.hash;
  document.open();document.write(html);document.close();
  if(h&&h.length>1&&h.indexOf("#v=")!==0)setTimeout(function(){try{var e=document.getElementById(decodeURIComponent(h.slice(1)));if(e)e.scrollIntoView()}catch(x){}},60);
}
function derive(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"])
    .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:b(S),iterations:N,hash:"SHA-256"},k,256)})
    .then(function(bits){return new Uint8Array(bits)});
}
if(!window.crypto||!crypto.subtle){show("This browser cannot unlock the page. Open it over https in a current browser.");return}
if(location.hash==="#lock"){try{localStorage.removeItem(K)}catch(e){}history.replaceState(null,"",location.pathname);show("Signed out on this device.")}
else{
  var saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved){plain(b(saved)).then(put).catch(function(){try{localStorage.removeItem(K)}catch(e){}show("The password has changed. Enter the new one.")})}
  else show("");
}

  var pw=$("pw").value.trim();if(!pw)return;
  $("go").disabled=true;$("msg").textContent="";
  derive(pw).then(function(raw){
    return plain(raw).then(function(html){try{localStorage.setItem(K,b64(raw))}catch(e){}put(html)});
  }).catch(function(){$("pw").value="";show("That password did not work.")});
});
