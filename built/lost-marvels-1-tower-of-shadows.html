function b(s){var r=atob(s),a=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function b64(a){var s="",i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function $(i){return document.getElementById(i)}
function show(m){$("gate").hidden=false;$("msg").textContent=m||"";$("go").disabled=false;try{$("pw").focus()}catch(e){}}
function plain(raw){
  return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])
    .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},k,b(CT))})
    .then(function(buf){return new TextDecoder().decode(buf)});
}
function put(html){
  // A remembered key decrypts in a few ms - before this shell has finished
  // loading. Writing then APPENDS to the shell instead of replacing it (the
  // sign-in styles bleed into the page), so wait for the load to end.
  if(document.readyState!=="complete"){window.addEventListener("load",function(){put(html)});return}
  var h=location.hash;
